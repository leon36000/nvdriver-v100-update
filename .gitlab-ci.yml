stages:
  - software
  - preflight
  - quality

variables:
  PYTHONDONTWRITEBYTECODE: "1"

cpu-focused-regression:
  stage: software
  when: always
  dependencies: []
  image: python:3.12-bookworm
  script:
    - python3 --version
    - cc --version
    - >-
      python3 -B -m unittest
      tests.test_hybrid580_uvm_csl_rotate_key
      tests.test_transfer_manifest
      tests.test_compressed_evidence
      tests.test_ci_security_report_summary
      tests.test_sonar_runner_endpoint_probe
      tests.test_sonar_token_access_probe
      -v
    - python3 -B tools/audit_transfer_document_links.py --root "$CI_PROJECT_DIR"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'

transfer-snapshot-integrity:
  stage: software
  when: always
  dependencies: []
  image: python:3.12-bookworm
  script:
    - python3 -B tools/verify_compressed_evidence.py --root "$CI_PROJECT_DIR" --manifest evidence/gitlab-compressed-evidence-manifest-20261105.json
    - python3 -B tools/verify_transfer_manifest.py --root "$CI_PROJECT_DIR" --manifest evidence/gitlab-transfer-manifest-20261105.json.gz --verify-tree
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'

gitguardian-secret-history:
  stage: quality
  when: always
  dependencies: []
  image: gitguardian/ggshield:1.55.0
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  script:
    - ggshield secret scan repo "$CI_PROJECT_DIR"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "transfer-preflight" && $GITGUARDIAN_API_KEY'

sonarqube-analysis:
  stage: quality
  when: always
  needs:
    - job: sonarqube-runner-network-preflight
      artifacts: true
  image:
    name: sonarsource/sonar-scanner-cli:11.2.1.1844_7.0.2
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - test -n "$SONAR_HOST_URL"
    - test -n "$SONAR_TOKEN"
    - >-
      node tools/run_sonar_scanner_with_hosts_override.mjs
      --preflight sonar-runner-preflight.json
      --endpoint "$SONAR_HOST_URL"
      --fallback-ip "${SONAR_HOST_IP:-}"
      --
      -Dsonar.projectKey=nvdriver-v100-update
      -Dsonar.projectName=NVIDIA_V100_Blackwell_Hybrid_Driver
      -Dsonar.sources=src,kernels,probes,tools
      -Dsonar.tests=tests
      -Dsonar.exclusions=evidence/**,patches/**,build/**,tests/fixtures/**
      -Dsonar.qualitygate.wait=true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $SONAR_HOST_URL && $SONAR_TOKEN'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS && $SONAR_HOST_URL && $SONAR_TOKEN'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $SONAR_HOST_URL && $SONAR_TOKEN'
  allow_failure: true

sonarqube-launcher-regression:
  stage: quality
  when: always
  dependencies: []
  image:
    name: sonarsource/sonar-scanner-cli:11.2.1.1844_7.0.2
    entrypoint: [""]
  script:
    - node --version
    - node --test tests/test_sonar_scanner_hosts_override.mjs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'

sonarqube-runner-network-preflight:
  stage: preflight
  when: always
  allow_failure: true
  dependencies: []
  image: python:3.12-bookworm
  script:
    - >-
      python3 -B tools/probe_sonar_runner_endpoint.py
      --endpoint "$SONAR_HOST_URL"
      --fallback-ip "${SONAR_HOST_IP:-}"
      --output sonar-runner-preflight.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - sonar-runner-preflight.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $SONAR_HOST_URL'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $SONAR_HOST_URL'

sonarqube-token-access-preflight:
  stage: preflight
  when: always
  dependencies: []
  image: python:3.12-bookworm
  script:
    - >-
      python3 -B -m tools.probe_sonar_token_access
      --endpoint "$SONAR_HOST_URL"
      --fallback-ip "${SONAR_HOST_IP:-}"
      --project-key nvdriver-v100-update
      --output sonar-token-access-preflight.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - sonar-token-access-preflight.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $SONAR_HOST_URL && $SONAR_TOKEN'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $SONAR_HOST_URL && $SONAR_TOKEN'
  allow_failure: true

security-report-summary:
  stage: quality
  image: python:3.12-bookworm
  needs:
    - job: pc4_gitleaks
      artifacts: true
      optional: true
    - job: pc4_semgrep
      artifacts: true
      optional: true
    - job: pc4_trivy
      artifacts: true
      optional: true
  when: always
  script:
    - python3 -B tools/summarize_ci_security_reports.py --root "$CI_PROJECT_DIR" --output security-report-summary.json
    - cat security-report-summary.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - security-report-summary.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
