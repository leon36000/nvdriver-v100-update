# Candidate-only option for the hash-pinned R595.99.02 nvidia_uvm module
# rebuilt with the R580.196.07 GV100 HAL. The module defaults this option to
# false; hybrid execution requires it to be enabled at module load.
# Do not install with NVIDIA's stock nvidia_uvm module, which lacks this option.
# No system configuration is changed by this project.
options nvidia_uvm uvm_hybrid_isolated_gpu_execution=1
